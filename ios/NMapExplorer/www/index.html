<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="nmap - 視障者與明眼人協同真實地圖數位分身探索器 (含雙視角 2D 幾何雷達與動態街景視覺)">
  <title>nmap 視障者真實地圖世界探索器 (行動導航版)</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 10px; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    h1 { color: #38bdf8; font-size: 1.5em; text-align: center; margin: 10px 0; }
    .controls { display: flex; gap: 10px; margin-bottom: 10px; }
    .btn { flex: 1; padding: 15px; font-size: 1.2em; border-radius: 8px; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; }
    .btn:active { background: #0284c7; }
    .history-container { flex: 1; overflow-y: auto; background: #1e293b; border-radius: 8px; padding: 10px; border: 1px solid #334155; }
    .history-list { list-style: none; padding: 0; margin: 0; }
    .history-item { padding: 12px; border-bottom: 1px solid #334155; font-size: 1.2em; }
    .history-item:last-child { border-bottom: none; }
    /* Invisible live region for immediate speech */
    #nvda-live-log { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  </style>
</head>
<body>

  <h1>nmap 行動導航版</h1>

  <!-- 權限不足提示橫幅 -->
  <div id="permission-banner" class="banner" style="display:none; background:#78350f; border:1px solid #f59e0b; border-radius:8px; padding:12px; margin-bottom:10px;" role="alert">
    <p id="permission-text" style="color:#fef08a; font-weight:bold; font-size:1.1em; margin-bottom:8px;">📍 定位權限未開啟，已進入手動探索模式。</p>
    <div style="display:flex; gap:10px;">
      <button id="open-settings-btn" class="btn" style="background:#eab308; color:#0f172a; padding:10px; font-size:1em;" aria-label="前往系統設定開啟精確定位權限">開啟系統設定</button>
      <button id="manual-search-btn" class="btn" style="background:#38bdf8; color:#0f172a; padding:10px; font-size:1em;" aria-label="切換至手動輸入地址搜尋">輸入地址探索</button>
    </div>
  </div>

  <!-- 手動地址/地標搜尋列 -->
  <div id="search-section" style="display: flex; gap: 8px; margin-bottom: 10px;">
    <input id="location-input-visible" type="text" placeholder="輸入地址、地標或座標 (例: 淡水老街)..." style="flex: 1; padding: 12px; font-size: 1.1em; border-radius: 8px; border: 1px solid #38bdf8; background: #1e293b; color: #f8fafc;" aria-label="輸入探索起點地址或地標">
    <button id="search-go-btn" class="btn" style="width: auto; padding: 12px 18px;" aria-label="立即前往此地點開始探索">前往</button>
  </div>

  <div class="controls" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
    <button id="ui-btn-scan" class="btn" aria-label="掃描前方店家">掃描前方 (L)</button>
    <button id="ui-btn-around" class="btn" aria-label="掃描周遭所有店家">周遭所有 (P)</button>
    <button id="ui-btn-intersection" class="btn" aria-label="查詢前方路口走向與分支">前方路口 (I)</button>
    <button id="ui-btn-loc" class="btn" aria-label="播報當前定位">目前位置 (R)</button>
    <button id="ui-btn-settings" class="btn" style="grid-column: span 2; background: #6366f1; color: #f8fafc; font-size: 1.1em; padding: 12px; font-weight: bold;" aria-label="開啟偏好設定，可設定轉動播報方位、音效與觸覺回饋">⚙️ 偏好設定</button>
    <button id="ui-btn-map-db" class="btn" style="background: #0d9488; color: #f8fafc; font-size: 1em; padding: 10px; font-weight: bold;" aria-label="下載離線地圖資料庫，點擊可下載全台灣190萬筆店家資料">📥 離線圖資管理</button>
    <button id="ui-btn-check-update" class="btn" style="background: #0369a1; color: #f8fafc; font-size: 1em; padding: 10px;" aria-label="檢查 GitHub 最新發布版本">檢查更新</button>
    <button id="ui-btn-export-log" class="btn" style="grid-column: span 2; background: #334155; color: #f8fafc; font-size: 1em; padding: 10px;" aria-label="匯出並分享手機診斷日誌">匯出診斷日誌</button>
  </div>

  <!-- 偏好設定無障礙對話框 (Accessible Extensible Settings Modal) -->
  <div id="settings-modal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center;" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
    <div class="modal-content" style="background:#1e293b; border:2px solid #6366f1; border-radius:12px; padding:16px; max-width:480px; width:90%; margin:auto; max-height:85vh; overflow-y:auto;">
      <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding-bottom:8px; margin-bottom:14px;">
        <h2 id="settings-modal-title" style="color:#818cf8; font-size:1.35em; margin:0;" tabindex="0">⚙️ 偏好設定</h2>
        <button id="settings-modal-close-btn" class="btn-close" style="color:#cbd5e1; font-size:1.8em; background:none; border:none; padding:4px 8px; cursor:pointer;" aria-label="關閉設定對話框">×</button>
      </div>

      <div id="settings-modal-body" style="display:flex; flex-direction:column; gap:16px; margin-bottom:18px;">
        
        <!-- 設定分類 1：方位與轉向語音播報 -->
        <fieldset style="border:1px solid #475569; border-radius:8px; padding:12px; margin:0;">
          <legend style="color:#a5b4fc; font-weight:bold; font-size:1.1em; padding:0 6px;">🧭 方位與轉向語音</legend>
          
          <label style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; cursor:pointer; font-size:1.1em;">
            <span id="label-turn-announce">轉動手機即時播報方位</span>
            <input type="checkbox" id="setting-turn-announce" checked style="width:24px; height:24px; accent-color:#6366f1;" aria-labelledby="label-turn-announce" aria-describedby="desc-turn-announce">
          </label>
          <p id="desc-turn-announce" style="color:#94a3b8; font-size:0.92em; line-height:1.5; margin:0 0 12px 0;">啟用時，轉動手機會由原生語音瞬間報讀最新朝向（如「正北」、「北北東」），不干擾螢幕報讀器。</p>

          <label style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; cursor:pointer; font-size:1.1em;">
            <span id="label-tick-sound">轉向立體聲刻度音與微震 (Tick)</span>
            <input type="checkbox" id="setting-tick-sound" checked style="width:24px; height:24px; accent-color:#6366f1;" aria-labelledby="label-tick-sound" aria-describedby="desc-tick-sound">
          </label>
          <p id="desc-tick-sound" style="color:#94a3b8; font-size:0.92em; line-height:1.5; margin:0;">轉動每跨越 15 度時發出左右立體聲音效與手錶般的清脆微震。</p>
        </fieldset>

        <!-- 設定分類 2：無障礙與觸覺回饋（可隨時擴展新設定） -->
        <fieldset style="border:1px solid #475569; border-radius:8px; padding:12px; margin:0;">
          <legend style="color:#a5b4fc; font-weight:bold; font-size:1.1em; padding:0 6px;">📳 觸覺與自動提醒</legend>

          <label style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; cursor:pointer; font-size:1.1em;">
            <span id="label-auto-poi-announce">接近店家自動提醒 (VoiceVista)</span>
            <input type="checkbox" id="setting-auto-poi-announce" checked style="width:24px; height:24px; accent-color:#6366f1;" aria-labelledby="label-auto-poi-announce" aria-describedby="desc-auto-poi-announce">
          </label>
          <p id="desc-auto-poi-announce" style="color:#94a3b8; font-size:0.92em; line-height:1.5; margin:0 0 12px 0;">步行接近前方 50 米內店家時，自動以極簡省話報讀店名與鐘點方位。</p>

          <label style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; cursor:pointer; font-size:1.1em;">
            <span id="label-haptic-feedback">正北重震與齒輪觸覺</span>
            <input type="checkbox" id="setting-haptic-feedback" checked style="width:24px; height:24px; accent-color:#6366f1;" aria-labelledby="label-haptic-feedback" aria-describedby="desc-haptic-feedback">
          </label>
          <p id="desc-haptic-feedback" style="color:#94a3b8; font-size:0.92em; line-height:1.5; margin:0;">面向正北 (0°) 時發出雙重重震，每逢 16 方位齒輪刻度時輕震確認。</p>
        </fieldset>

      </div>

      <div style="display:grid; grid-template-columns:1fr; gap:10px;">
        <button id="settings-modal-close-bottom-btn" class="btn" style="background:#6366f1; color:#f8fafc; padding:12px; font-size:1.05em; font-weight:bold;" aria-label="儲存設定並關閉設定視窗">完成設定 (Esc)</button>
      </div>
    </div>
  </div>


  <!-- App 自動更新提示對話框 (App Update Accessible Modal) -->
  <div id="update-modal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center;" role="dialog" aria-modal="true" aria-labelledby="update-modal-title">
    <div class="modal-content" style="background:#1e293b; border:2px solid #38bdf8; border-radius:12px; padding:16px; max-width:480px; width:90%; margin:auto;">
      <h2 id="update-modal-title" style="color:#38bdf8; font-size:1.3em; margin:0 0 10px 0;" tabindex="0">🚀 發現新版本</h2>
      <div id="update-modal-body" style="font-size:1.1em; line-height:1.6; color:#f8fafc; margin-bottom:14px;" tabindex="0">
        <!-- 動態注入更新說明 -->
      </div>
      <div id="update-progress-container" style="display:none; margin-bottom:12px;">
        <p id="update-progress-text" style="color:#38bdf8; font-size:1em; margin-bottom:4px;">下載進度：0%</p>
        <div style="width:100%; background:#334155; height:10px; border-radius:5px; overflow:hidden;">
          <div id="update-progress-bar" style="width:0%; background:#38bdf8; height:100%; transition:width 0.3s;"></div>
        </div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <button id="update-btn-confirm" class="btn" style="background:#22c55e; color:#0f172a; padding:10px; font-size:1em;" aria-label="立即下載新版安裝檔並更新">立即更新</button>
        <button id="update-btn-cancel" class="btn" style="background:#475569; color:#f8fafc; padding:10px; font-size:1em;" aria-label="稍後再更新">稍後再說</button>
      </div>
    </div>
  </div>

  <!-- 離線地圖資料庫管理對話框 (Offline Map Database Modal) -->
  <div id="map-db-modal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center;" role="dialog" aria-modal="true" aria-labelledby="map-db-modal-title">
    <div class="modal-content" style="background:#1e293b; border:2px solid #0d9488; border-radius:12px; padding:16px; max-width:480px; width:90%; margin:auto;">
      <h2 id="map-db-modal-title" style="color:#2dd4bf; font-size:1.3em; margin:0 0 10px 0;" tabindex="0">📦 離線店家圖資管理</h2>
      <div id="map-db-modal-body" style="font-size:1.1em; line-height:1.6; color:#f8fafc; margin-bottom:14px;" tabindex="0">
        <!-- 動態注入圖資狀態 -->
      </div>
      <div id="map-db-progress-container" style="display:none; margin-bottom:12px;">
        <p id="map-db-progress-text" style="color:#2dd4bf; font-size:1em; margin-bottom:4px;">圖資下載進度：0%</p>
        <div style="width:100%; background:#334155; height:10px; border-radius:5px; overflow:hidden;">
          <div id="map-db-progress-bar" style="width:0%; background:#2dd4bf; height:100%; transition:width 0.3s;"></div>
        </div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <button id="map-db-btn-download" class="btn" style="background:#0d9488; color:#f8fafc; padding:10px; font-size:1em;" aria-label="下載或更新全台 190 萬筆店家離線圖資">下載/更新圖資</button>
        <button id="map-db-btn-delete" class="btn" style="background:#b91c1c; color:#f8fafc; padding:10px; font-size:1em;" aria-label="刪除離線圖資釋放手機儲存空間">刪除圖資</button>
        <button id="map-db-btn-close" class="btn" style="grid-column:span 2; background:#475569; color:#f8fafc; padding:10px; font-size:1em;" aria-label="關閉圖資管理對話框">關閉 (Esc)</button>
      </div>
    </div>
  </div>


  <div class="history-container" aria-label="歷史訊息與店家列表，可上下滑動逐條讀取或點擊地標查看詳情">
    <ul id="history-list" class="history-list">
      <li class="history-item" tabindex="0">歡迎使用 nmap！定位系統啟動中...</li>
    </ul>
  </div>

  <!-- 地標詳細資訊無障礙對話框 (POI Detail Accessible Modal) -->
  <div id="poi-detail-modal" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="poi-modal-title">
    <div class="modal-content" style="background:#1e293b; border:2px solid #38bdf8; border-radius:12px; padding:16px; max-width:500px; width:92%;">
      <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding-bottom:8px; margin-bottom:12px;">
        <h2 id="poi-modal-title" style="color:#38bdf8; font-size:1.4em; margin:0;" tabindex="0">地標詳細資訊</h2>
        <button id="poi-modal-close-btn" class="btn-close" style="color:#cbd5e1; font-size:1.8em; background:none; border:none; padding:4px 8px;" aria-label="關閉對話框">×</button>
      </div>
      <div id="poi-modal-body" style="font-size:1.15em; line-height:1.7; color:#f8fafc; margin-bottom:16px;" tabindex="0">
        <!-- 動態注入地標資料 -->
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <button id="poi-modal-nav-nmap" class="btn" style="background:#38bdf8; color:#0f172a; padding:12px; font-size:1.05em;" aria-label="啟動 3D 空間聲音導引前往此地標">🎯 空間聲音導引</button>
        <button id="poi-modal-nav-gmaps" class="btn" style="background:#22c55e; color:#0f172a; padding:12px; font-size:1.05em;" aria-label="開啟 Google 地圖步行導航">🗺️ Google 導航</button>
        <button id="poi-modal-dismiss" class="btn" style="grid-column:span 2; background:#475569; color:#f8fafc; padding:10px; font-size:1em;" aria-label="關閉地標詳情對話框">關閉 (Esc)</button>
      </div>
    </div>
  </div>

  <!-- Dedicated live region for immediate speech -->
  <div id="nvda-live-log" aria-live="assertive" aria-atomic="true"></div>

  <!-- Hidden elements to keep app.js happy -->
  <div style="display:none;" aria-hidden="true">
    <canvas id="radar-canvas" width="300" height="300"></canvas>
    <div id="status-badge"></div>
    <div id="poi-list-container"></div>
    <button id="sound-toggle-btn"></button>
    <button id="visual-mode-btn"></button>
    <div id="visual-section"></div>
    <button id="help-btn"></button>
    <div id="help-modal"></div>
    <button id="close-modal-btn"></button>
    <button id="modal-ok-btn"></button>
    <input id="location-input" />
    <input id="query-input" />
    <button id="btn-forward"></button>
    <button id="btn-back"></button>
    <button id="btn-turn-left"></button>
    <button id="btn-turn-right"></button>
    <button id="btn-look"></button>
    <div id="street-scene-summary"></div>
    <div id="street-tags-container"></div>
    <button id="export-log-btn"></button>
    <form id="teleport-form"></form>
    <form id="nlp-form"></form>
    <form id="query-form"></form>
  </div>

  <script src="spatial_engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
