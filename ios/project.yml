name: NMapExplorer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: 16.0
  developmentLanguage: zh-Hant

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: 1,2
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  NMapExplorer:
    type: application
    platform: iOS
    sources:
      - path: NMapExplorer
    info:
      path: NMapExplorer/Resources/Info.plist
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nmapexplorer
        PRODUCT_NAME: NMapExplorer
        INFOPLIST_FILE: NMapExplorer/Resources/Info.plist
