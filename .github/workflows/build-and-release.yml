name: Build & Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (例如 v1.0.1)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: '更新說明 (Release Notes)'
        required: false
        default: '效能最佳化與無障礙導航功能更新。'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11 (Required for Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK (Release & Debug)
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare Release APK Artifacts
        run: |
          mkdir -p release_assets
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ] || [ "$TAG_NAME" = "master" ]; then
            TAG_NAME="${{ github.event.inputs.version_tag }}"
          fi
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v1.0.0"
          fi
          
          # 優先使用正式 Release APK（經由固定金鑰簽署，非 debuggable）
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_assets/nmap_explorer.apk
            cp app/build/outputs/apk/release/app-release.apk release_assets/nmap_explorer_${TAG_NAME}.apk
            cp app/build/outputs/apk/release/app-release.apk release_assets/app-release.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/nmap_explorer.apk
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/nmap_explorer_${TAG_NAME}.apk
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/app-release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/app-debug.apk
          fi

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: Release ${{ github.ref_name || github.event.inputs.version_tag }}
          body: ${{ github.event.inputs.release_notes || '🚀 NMap Explorer 無障礙地圖探索器自動發布版本。' }}
          tag_name: ${{ github.ref_name || github.event.inputs.version_tag }}
          files: |
            release_assets/*.apk
            release_assets/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
